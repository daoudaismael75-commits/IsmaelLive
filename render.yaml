services:
  - type: web
    name: ismael-live
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: LIVE_USER
        value: ismael
      - key: LIVE_PASSWORD
        sync: false
      - key: XAI_API_KEY
        sync: false
